name: CI - Retail Inventory Management System

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  # ============================
  # Backend - Spring Boot
  # ============================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java Version
        run: java -version

      - name: Build Backend
        run: mvn -B clean package -DskipTests

      - name: Run Backend Tests
        run: mvn -B test


  # ============================
  # Frontend - Angular
  # ============================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node and npm Versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build

      - name: Run Frontend Tests
        run: |
          if node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('angular.json','utf8'));process.exit(cfg.projects?.['frontend-ng']?.architect?.test?0:1)"; then
            npm test -- --watch=false
          else
            echo "Skipping frontend unit tests: no Angular test target is configured."
          fi
